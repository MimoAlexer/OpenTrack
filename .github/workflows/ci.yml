name: Verify implementation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      verify: ${{ steps.scope.outputs.verify }}
    steps:
      - name: Checkout complete history for authoritative scope
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test conservative change detection
        run: python3 scripts/test-ci-scope.py
      - name: Test native verification modes and failure propagation
        run: python3 desktop/scripts/test-check.py
      - name: Determine implementation scope
        id: scope
        run: python3 scripts/ci-scope.py

  verify:
    needs: scope
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    services:
      postgres:
        image: ${{ needs.scope.result == 'success' && needs.scope.outputs.verify == 'true' && 'postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          # Ephemeral job-service bootstrap credential; never used by the app.
          POSTGRES_PASSWORD: ci-service-only-not-for-deployment
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Require a successful explicit scope decision
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUN_FULL: ${{ needs.scope.outputs.verify }}
        run: |
          if [ "$SCOPE_RESULT" != success ]; then
            echo '::error::Change detection failed; required verification cannot be skipped.'
            exit 1
          fi
          case "$RUN_FULL" in true|false) ;; *) echo '::error::Invalid or absent scope output.'; exit 1;; esac
      - name: Complete unchanged implementation check
        if: ${{ needs.scope.outputs.verify == 'false' }}
        run: echo 'Required verify check passed; this range changes documentation only or has no changes.'
      - name: Checkout
        if: ${{ needs.scope.outputs.verify == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, verified 2026-10-17
        with:
          persist-credentials: false
      - name: Node toolchain
        if: ${{ needs.scope.outputs.verify == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7, verified 2026-10-17
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            scripts/contracts/package-lock.json
      - name: Rust toolchain
        if: ${{ needs.scope.outputs.verify == 'true' }}
        shell: bash
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component clippy --component rustfmt
      - name: PostgreSQL client
        if: ${{ needs.scope.outputs.verify == 'true' }}
        shell: bash
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends postgresql-client
          fi
      - name: Storage and installed-scanner qualification prerequisites
        if: ${{ needs.scope.outputs.verify == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clamav-daemon util-linux
          dpkg-query --show clamav-daemon util-linux
      - name: Isolated database identities
        if: ${{ needs.scope.outputs.verify == 'true' }}
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: ci-service-only-not-for-deployment
        run: python3 scripts/ci-db.py
      - name: Verify Rust, PostgreSQL contracts and frontend
        if: ${{ needs.scope.outputs.verify == 'true' }}
        run: scripts/check.sh
      - name: Qualify real storage exhaustion and installed scanner failures
        if: ${{ needs.scope.outputs.verify == 'true' }}
        env:
          OPENTRACK_TEST_CLAMD_BIN: /usr/sbin/clamd
        run: |
          bash scripts/qualify-attachment-storage.sh
          bash scripts/qualify-attachment-scanner.sh
      - name: Report workspace disk usage
        if: ${{ always() && needs.scope.result == 'success' && needs.scope.outputs.verify == 'true' }}
        shell: bash
        run: |
          df -h .
          du -sh target web/node_modules scripts/contracts/node_modules work 2>/dev/null || true

  native-contracts:
    needs: scope
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Require a successful explicit scope decision
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUN_FULL: ${{ needs.scope.outputs.verify }}
        run: |
          if [ "$SCOPE_RESULT" != success ]; then
            echo '::error::Change detection failed; native contract verification cannot be skipped.'
            exit 1
          fi
          case "$RUN_FULL" in true|false) ;; *) echo '::error::Invalid or absent scope output.'; exit 1;; esac
      - name: Complete unchanged native contract check
        if: ${{ needs.scope.outputs.verify == 'false' }}
        run: echo 'Native contract check passed; this range changes documentation only or has no changes.'
      - name: Checkout
        if: ${{ needs.scope.outputs.verify == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Rust toolchain
        if: ${{ needs.scope.outputs.verify == 'true' }}
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component clippy --component rustfmt
      - name: Native core Linux prerequisites
        if: ${{ needs.scope.outputs.verify == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential pkg-config libglib2.0-dev
          rustc --version
          cargo --version
          dpkg-query --show build-essential pkg-config libglib2.0-dev
          pkg-config --modversion glib-2.0 gobject-2.0 gio-2.0
      - name: Verify native broker, OpenAPI parity and negative request policy
        if: ${{ needs.scope.outputs.verify == 'true' }}
        run: desktop/scripts/check.sh --core
      - name: Report native workspace disk usage
        if: ${{ always() && needs.scope.result == 'success' && needs.scope.outputs.verify == 'true' }}
        run: |
          df -h .
          du -sh desktop/target 2>/dev/null || true
